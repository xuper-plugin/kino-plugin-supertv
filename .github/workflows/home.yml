name: Home pre-armado

# Genera, por servidor, el Home pre-armado de SuperTV (canales estables por grupo/tab, SIN eventos del momento) y lo publica
# en home/<serverKey>.json. El plugin lo baja y pinta su Home al instante (si falta o está viejo, cae a la carga en vivo).
on:
  schedule:
    - cron: "0 7,19 * * *"  # 2 veces al día (canales estables; los eventos no se cachean, se cargan en vivo)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home
  cancel-in-progress: false

jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar el Home de cada servidor
        run: node scripts/gen-home.mjs

      - name: Publicar si cambió algo
        run: |
          git add home
          if git diff --cached --quiet; then
            echo "sin cambios en home/"
            exit 0
          fi
          git config user.name "xuper-plugin"
          git config user.email "335105665+xuper-plugin@users.noreply.github.com"
          git commit -m "Home pre-armado: actualiza home/<serverKey>.json"
          git push origin HEAD:main
