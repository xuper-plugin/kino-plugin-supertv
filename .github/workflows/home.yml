name: Home pre-armado

# Genera, por servidor, el Home pre-armado de SuperTV (canales estables por grupo/tab, SIN eventos del momento) y lo publica
# SELLADO en home/<serverKey>.enc.json (AES-256-GCM con el secret FEED_KEY). El plugin lo abre con kino.secret("feedKey").
on:
  schedule:
    - cron: "0 7,19 * * *"  # 2 veces al día (canales estables; los eventos no se cachean, se cargan en vivo)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home
  cancel-in-progress: false

jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar el Home de cada servidor
        env:
          FEED_KEY: ${{ secrets.FEED_KEY }}
        run: node scripts/gen-home.mjs

      - name: Publicar si cambió algo
        run: |
          # quita los .json planos viejos por servidor (ahora se publica solo .enc.json); conserva index.json y los .enc.json
          find home -maxdepth 1 -name '*.json' ! -name '*.enc.json' ! -name 'index.json' -delete 2>/dev/null || true
          git add -A home
          if git diff --cached --quiet; then
            echo "sin cambios en home/"
            exit 0
          fi
          git config user.name "xuper-plugin"
          git config user.email "335105665+xuper-plugin@users.noreply.github.com"
          git commit -m "Home pre-armado: actualiza home/<serverKey>.enc.json"
          git pull --rebase origin main
          git push origin HEAD:main
